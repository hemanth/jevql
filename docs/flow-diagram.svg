<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" style="background:#ffffff; font-family:'Geist Mono', 'SF Mono', Monaco, monospace;">
  <defs>
    <style>
      .hdr { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; fill: #000000; text-transform: uppercase; }
      .lbl { font-size: 13px; font-weight: 700; fill: #000000; letter-spacing: -0.01em; }
      .sub { font-size: 10px; fill: #555555; }
      .wht-lbl { font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: -0.01em; }
      .wht-sub { font-size: 10px; fill: #cccccc; }
      .tag { font-size: 8px; font-weight: 700; fill: #000000; letter-spacing: 0.05em; }
      .wht-tag { font-size: 8px; font-weight: 700; fill: #ffffff; letter-spacing: 0.05em; }
      .stroke-base { stroke: #000000; stroke-width: 1.2px; fill: none; }
      .card-white { fill: #ffffff; stroke: #000000; stroke-width: 1.2px; }
      .card-black { fill: #000000; stroke: #000000; stroke-width: 1.2px; }
      .badge { fill: #ffffff; stroke: #000000; stroke-width: 0.8px; }
      .badge-black { fill: #000000; stroke: #ffffff; stroke-width: 0.8px; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="32" y="32" class="hdr">JEVQL COMPILER &amp; SYSTEM ONE EXECUTION TOPOLOGY</text>
  <line x1="32" y1="42" x2="928" y2="42" class="stroke-base" />

  <!-- STAGE 1: DECLARATIVE INPUT -->
  <rect x="32" y="66" width="190" height="135" rx="6" class="card-white" />
  <rect x="44" y="78" width="56" height="16" rx="2" class="badge" />
  <text x="50" y="89" class="tag">01 · INPUT</text>
  <text x="44" y="120" class="lbl">Query &amp; Source</text>
  <text x="44" y="142" class="sub">• Cognitive / SQL Syntax</text>
  <text x="44" y="158" class="sub">• In-Memory / PostgreSQL</text>
  <text x="44" y="174" class="sub">• JSON / CSV Streams</text>

  <!-- Connector 1 -->
  <line x1="222" y1="133" x2="260" y2="133" class="stroke-base" marker-end="url(#arr)" />

  <!-- STAGE 2: RELATIONAL PUSHDOWN -->
  <rect x="264" y="66" width="205" height="135" rx="6" class="card-white" />
  <rect x="276" y="78" width="82" height="16" rx="2" class="badge" />
  <text x="282" y="89" class="tag">02 · OPTIMIZE</text>
  <text x="276" y="120" class="lbl">Relational Pushdown</text>
  <text x="276" y="142" class="sub">• AST Predicate Partitioning</text>
  <text x="276" y="158" class="sub">• Drops Non-Matching Rows</text>
  <text x="276" y="174" class="sub" style="font-weight:700; fill:#000000;">• $0 Model Cost for Filtered</text>

  <!-- Connector 2 -->
  <line x1="469" y1="133" x2="507" y2="133" class="stroke-base" marker-end="url(#arr)" />

  <!-- STAGE 3: THE SIGNATURE INVERTED FOCAL CARD (JEV SYSTEM ONE ENGINE) -->
  <rect x="511" y="58" width="235" height="151" rx="6" class="card-black" />
  <rect x="525" y="72" width="102" height="16" rx="2" class="badge-black" />
  <text x="531" y="83" class="wht-tag">03 · SYSTEM ONE</text>
  <text x="525" y="116" class="wht-lbl">Speculative Fan-Out</text>
  <text x="525" y="138" class="wht-sub">• Bundles N questions in 1 call</text>
  <text x="525" y="154" class="wht-sub">• NOUL, CHOICE &amp; SCORE pass</text>
  <text x="525" y="170" class="wht-sub">• SHA-256 Memory Cache (&lt;0.05ms)</text>
  <text x="525" y="186" class="wht-sub" style="font-weight:700; fill:#ffffff;">• 12x Cheaper &amp; 0 Tokens Gen</text>

  <!-- Connector 3 -->
  <line x1="746" y1="133" x2="784" y2="133" class="stroke-base" marker-end="url(#arr)" />

  <!-- STAGE 4: STRUCTURED OUTPUT -->
  <rect x="788" y="66" width="140" height="135" rx="6" class="card-white" />
  <rect x="800" y="78" width="68" height="16" rx="2" class="badge" />
  <text x="806" y="89" class="tag">04 · OUTPUT</text>
  <text x="800" y="120" class="lbl">Typed Rows</text>
  <text x="800" y="142" class="sub">• Calibrated floats</text>
  <text x="800" y="158" class="sub">• Discrete winners</text>
  <text x="800" y="174" class="sub">• Aggregations</text>

  <!-- Bottom rule and telemetry note -->
  <line x1="32" y1="228" x2="928" y2="228" class="stroke-base" />
  <text x="32" y="244" class="sub">Guarantees: Zero token generation overhead · Full relational pushdown pruning · SHA-256 deterministic idempotency</text>
</svg>
