[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "jevql"
version = "0.1.0"
description = "PostgreSQL-compatible query language powered by TypeSafe Jev System One models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Hemanth HM", email = "hemanth.hm@gmail.com" },
]
keywords = ["sql", "postgres", "typesafe", "jev", "ai", "query-language", "system-one", "noul", "semantic-sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

[project.scripts]
jevql = "jevql.cli:main"

[project.urls]
Homepage = "https://github.com/hemanth/jevql"
Repository = "https://github.com/hemanth/jevql"
